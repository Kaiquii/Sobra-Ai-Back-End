name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run test harness
        run: sh ./scripts/test.sh

      - name: Run race detector
        run: go test -race ./... -count=1 -timeout=3m

      - name: PostgreSQL and HTTP integration tests
        run: go test -tags=integration -race ./cmd/api -count=1 -timeout=5m -coverpkg=./internal/...,./cmd/api -coverprofile=.artifacts/test/integration.out

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .artifacts/test/
          include-hidden-files: true
          if-no-files-found: ignore
